function rotateAnswers(correct,distractors,seed){
  const arr=[String(correct),...distractors.map(String)];
  const shift=seed%arr.length;
  const answers=[...arr.slice(shift),...arr.slice(0,shift)];
  return {answers,correct:answers.indexOf(String(correct))};
}
function qItem(id,topic,prompt,correct,distractors,explanation,seed=0){
  const o=rotateAnswers(correct,distractors,seed);
  return {id,category:"כמותי",topic,prompt,answers:o.answers,correct:o.correct,explanation};
}

  ];
  logic.forEach((x,i)=>out.push({id:"vg"+(n++),category:"מילולי",topic:i%2?"הסקה":"היגיון",prompt:x[0],answers:x[1],correct:x[2],explanation:x[3]}));

  const reform=[
    ["„המחקר לא הוכיח שהטיפול יעיל, אך צמצם את אי־הוודאות לגביו.” איזו טענה משקפת זאת בצורה הטובה ביותר?",["הראיות התחזקו אך אינן מכריעות","הטיפול הוכח כיעיל","אין כל מידע חדש","הטיפול הוכח כלא יעיל"],0,"צמצום אי־ודאות פירושו מידע מועיל אך לא הוכחה מלאה."],

}

function defaultState(){return{version:4,xp:0,streak:1,answered:0,correct:0,errors:[],topicStats:{},wordStats:{},dailyGoal:20,todayAnswered:0,lastStudyDate:null,user:null,lastSync:null,simulationHistory:[]}}
function loadState(){try{return{...defaultState(),...JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}}catch{return defaultState()}}
let state=loadState(),view="home",practice=null,lastChoice=null,deferredInstallPrompt=null,psychoTimer=null;
function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));debouncedCloudSave()}
function percent(a,b){return b?Math.round(a/b*100):0}
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function escapeHtml(s){return String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function nowDate(){return new Date().toISOString().slice(0,10)}
function updateStreak(){const today=nowDate();if(!state.lastStudyDate){state.lastStudyDate=today;return}if(state.lastStudyDate===today)return;const prev=new Date(state.lastStudyDate+'T12:00:00'),cur=new Date(today+'T12:00:00'),days=Math.round((cur-prev)/DAY);state.streak=days===1?state.streak+1:1;state.todayAnswered=0;state.lastStudyDate=today}
function topicStat(topic){return state.topicStats[topic]||{answered:0,correct:0}}
function getWordStat(word){return state.wordStats[word]||{box:0,seen:0,correct:0,dueAt:0,lastReviewed:null}}
function masteryPct(stat){return Math.round((Math.min(5,stat.box)/5)*100)}
function dueCount(){const n=Date.now();return wordBank.filter(w=>{const s=getWordStat(w.word);return s.seen>0&&s.dueAt<=n}).length}
function unseenCount(){return wordBank.filter(w=>getWordStat(w.word).seen===0).length}
function masteredCount(){return wordBank.filter(w=>getWordStat(w.word).box>=4).length}
function selectWords(count=15){const n=Date.now();const scored=wordBank.map(w=>{const s=getWordStat(w.word);let score=0;if(s.seen===0)score=650;else if(s.dueAt<=n)score=1100+(5-s.box)*80;else score=200+(5-s.box)*55;score+=Math.random()*50;return{w,score}}).sort((a,b)=>b.score-a.score);return scored.slice(0,Math.min(count,scored.length)).map(x=>x.w)}
function makeWordQuestion(entry,index){const sameLevel=wordBank.filter(w=>w.word!==entry.word&&Math.abs((w.level||2)-(entry.level||2))<=1);const pool=sameLevel.length>=3?sameLevel:wordBank.filter(w=>w.word!==entry.word);const distractors=shuffle(pool).slice(0,3);const useContext=index%2===1;const options=shuffle([entry,...distractors]);const official=entry.official?'<span class="official-mark">✓</span>':'';const syn=(entry.synonyms||[]).map(escapeHtml).join(' · ');const extra=`<div class="learning-extra"><strong>מילים קרובות</strong> ${syn||'—'}<br><strong>רמה</strong> ${entry.level||2}/4 ${entry.official?' · ✓ נצפתה בחומר מאל״ו שנבדק':''}</div>`;if(useContext){return{id:`w-${entry.word}-context`,word:entry.word,category:"מילים",topic:"אוצר מילים בהקשר",prompt:`איזו מילה משלימה את המשפט בצורה הטובה ביותר?<br><br>“${entry.sentence.replace('[[word]]','_____')}”`,answers:options.map(o=>o.word),correct:options.findIndex(o=>o.word===entry.word),explanation:`<strong>${entry.word}</strong> — ${entry.definition}.${extra}`}}return{id:`w-${entry.word}-definition`,word:entry.word,category:"מילים",topic:"פירושי מילים",prompt:`מה פירוש המילה „${entry.word}”? ${official}`,answers:options.map(o=>o.definition),correct:options.findIndex(o=>o.word===entry.word),explanation:`<strong>${entry.word}</strong> — ${entry.definition}.${extra}`}}
function buildWordQuestions(count=15){return selectWords(count).map(makeWordQuestion)}

function nav(active){return`<nav class="bottom-nav"><button class="nav-btn ${active==='home'?'active':''}" onclick="go('home')"><b>⌂</b>בית</button><button class="nav-btn ${active==='practice'?'active':''}" onclick="go('practice-menu')"><b>✎</b>תרגול</button><button class="nav-btn ${active==='words'?'active':''}" onclick="go('words-dashboard')"><b>א</b>מילים</button><button class="nav-btn ${active==='errors'?'active':''}" onclick="go('errors')"><b>!</b>טעויות</button><button class="nav-btn ${active==='progress'?'active':''}" onclick="go('progress')"><b>↗</b>התקדמות</button></nav>`}

function home(){updateStreak();saveLocal();const goal=Math.min(100,percent(state.todayAnswered,state.dailyGoal));const weak=Object.entries(state.topicStats).filter(([,s])=>s.answered).map(([t,s])=>({t,a:percent(s.correct,s.answered)})).sort((a,b)=>a.a-b.a)[0];return`<div class="app-shell">${topbar()}<div class="desktop-layout"><div><section class="hero"><h1>מוכנים לאימון?</h1><p>IDpsycho101 בוחר קודם מילים שהגיע הזמן לחזור עליהן, ואפשר גם לעבוד ממוקד לפי החולשות שזוהו.</p><div class="progress-wrap"><div class="progress-row"><span>היעד היומי</span><strong>${state.todayAnswered}/${state.dailyGoal}</strong></div><div class="progress"><div style="width:${goal}%"></div></div></div><div id="install-slot"></div></section><div class="section-title">בחר אימון</div><div class="grid"><div class="card mode-card" onclick="startPractice('words')"><div class="emoji">א</div><div><h3>מילים בעברית</h3><p>${wordBank.length} מילים · חזרה חכמה לפי שליטה.</p></div></div><div class="card mode-card" onclick="startPractice('quantitative')"><div class="emoji">∑</div><div><h3>חשיבה כמותית</h3><p>${questions.quantitative.length} שאלות ממגוון נושאים.</p></div></div><div class="card mode-card" onclick="startPractice('verbal')"><div class="emoji">◎</div><div><h3>חשיבה מילולית</h3><p>${questions.verbal.length} שאלות מקוריות.</p></div></div><div class="card mode-card" onclick="startMixed()"><div class="emoji">⚡</div><div><h3>אימון יומי</h3><p>שילוב אוטומטי מכל התחומים.</p></div></div><div class="card mode-card" onclick="startPsychoSimulation()"><div class="emoji">⏱</div><div><h3>מיני סימולציה</h3><p>20 שאלות כמותי + מילולי עם זמן מוגבל.</p></div></div><div class="card mode-card" onclick="startWeakestTopic()"><div class="emoji">🎯</div><div><h3>האימון המומלץ</h3><p>${weak?`כרגע כדאי לחזק: ${escapeHtml(weak.t)} (${weak.a}%)`:'ייפתח לפי החולשות שיצטברו.'}</p></div></div></div></div><aside><div class="section-title">היום שלך</div><div class="stats"><div class="stat"><strong>${state.xp}</strong><span>XP</span></div><div class="stat"><strong>🔥 ${state.streak}</strong><span>רצף</span></div><div class="stat"><strong>${percent(state.correct,state.answered)}%</strong><span>דיוק</span></div></div><div class="section-title">מצב המילים</div><div class="card"><div class="topic-row"><span>לחזרה עכשיו</span><strong>${dueCount()}</strong></div><div class="topic-row"><span>טרם נלמדו</span><strong>${unseenCount()}</strong></div><div class="topic-row"><span>שליטה גבוהה</span><strong>${masteredCount()}</strong></div></div></aside></div>${nav('home')}</div>`}
function topicOptions(type){return [...new Set(questions[type].map(q=>q.topic))].sort().map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('')}
function practiceMenu(){return`<div class="app-shell">${topbar()}<div class="section-title">תרגול</div><div class="grid"><div class="card mode-card" onclick="startPractice('words')"><div class="emoji">א</div><div><h3>מילים</h3><p>${wordBank.length} מילים · 15 בכל אימון</p></div></div><div class="card"><h3>כמותי לפי נושא</h3><select id="quant-topic" class="form-control" style="width:100%;padding:10px;margin:8px 0"><option value="all">כל הנושאים</option>${topicOptions('quantitative')}</select><button class="primary-btn" onclick="startFocused('quantitative','quant-topic')">התחל תרגול כמותי</button></div><div class="card"><h3>מילולי לפי נושא</h3><select id="verbal-topic" class="form-control" style="width:100%;padding:10px;margin:8px 0"><option value="all">כל הנושאים</option>${topicOptions('verbal')}</select><button class="primary-btn" onclick="startFocused('verbal','verbal-topic')">התחל תרגול מילולי</button></div><div class="card mode-card" onclick="startMixed()"><div class="emoji">⚡</div><div><h3>מעורב</h3><p>מילים + כמותי + מילולי</p></div></div><div class="card mode-card" onclick="startPsychoSimulation()"><div class="emoji">⏱</div><div><h3>מיני סימולציה</h3><p>20 שאלות, 20 דקות.</p></div></div></div><div class="section-title">על מאגר המילים</div><div class="card source-card"><div class="source-head"><strong>${WORD_BANK_META.name}</strong><span class="pill">${wordBank.length} מילים</span></div><p>${WORD_BANK_META.basis}.</p><p class="small">${WORD_BANK_META.disclaimer}</p><div class="source-legend"><span class="official-mark">✓</span> מסמן רק מילה שנצפתה בחומר רשמי שנבדק. משפטי התרגול וההגדרות באפליקציה הם ניסוחים מקוריים.</div></div>${nav('practice')}</div>`}
function wordsDashboard(){const due=dueCount(),unseen=unseenCount(),mastered=masteredCount(),seen=wordBank.length-unseen;return`<div class="app-shell">${topbar()}<div class="section-title">אוצר המילים שלך</div><div class="word-dashboard"><div class="stat"><strong>${wordBank.length}</strong><span>במאגר</span></div><div class="stat"><strong>${seen}</strong><span>נלמדו</span></div><div class="stat"><strong>${due}</strong><span>לחזרה</span></div><div class="stat"><strong>${mastered}</strong><span>שליטה גבוהה</span></div></div><div class="section-title">חזרה חכמה</div><div class="card"><p class="small">תשובה נכונה מעלה את המילה שלב וקובעת חזרה רחוקה יותר. טעות מחזירה אותה לשלב הראשון, כך שמילים חלשות חוזרות מוקדם יותר.</p><button class="primary-btn" onclick="startPractice('words')">התחל אימון של 15 מילים</button></div><div class="section-title">רמות קושי במאגר</div><div class="card">${[1,2,3,4].map(l=>`<div class="topic-row"><span>רמה ${l}</span><strong>${wordBank.filter(w=>w.level===l).length}</strong></div>`).join('')}</div>${nav('words')}</div>`}
function startPractice(type,topic='all'){let list=type==='words'?buildWordQuestions(15):questions[type].filter(q=>topic==='all'||q.topic===topic);list=shuffle(list).slice(0,type==='words'?15:20);practice={list,index:0,answeredCurrent:false,sessionCorrect:0,timed:false,kind:type};lastChoice=null;view='question';render()}
function startFocused(type,selectId){const topic=document.getElementById(selectId)?.value||'all';startPractice(type,topic)}
function startMixed(){const list=shuffle([...buildWordQuestions(8),...questions.quantitative,...questions.verbal]).slice(0,18);practice={list,index:0,answeredCurrent:false,sessionCorrect:0,timed:false,kind:'mixed'};lastChoice=null;view='question';render()}
function startWeakestTopic(){const weakest=Object.entries(state.topicStats).filter(([,s])=>s.answered>0).sort((a,b)=>percent(a[1].correct,a[1].answered)-percent(b[1].correct,b[1].answered))[0];if(!weakest){startMixed();return}const [topic]=weakest;const type=questions.quantitative.some(q=>q.topic===topic)?'quantitative':'verbal';startPractice(type,topic)}
function startPsychoSimulation(){clearInterval(psychoTimer);const list=shuffle([...questions.quantitative,...questions.verbal]).slice(0,20);practice={list,index:0,answeredCurrent:false,sessionCorrect:0,timed:true,timeLeft:20*60,kind:'simulation'};lastChoice=null;view='question';psychoTimer=setInterval(()=>{if(!practice?.timed)return;practice.timeLeft--;if(practice.timeLeft<=0){finishPractice();return}const el=document.getElementById('psycho-timer');if(el)el.textContent=formatPsychoTime(practice.timeLeft)},1000);render()}
function formatPsychoTime(sec){const m=Math.floor(sec/60),s=sec%60;return `${m}:${s<10?'0':''}${s}`}
function updateWordReview(q,good){if(!q.word)return;const s=getWordStat(q.word),box=good?Math.min(5,(s.box||0)+1):0;let dueAt;if(good)dueAt=Date.now()+REVIEW_INTERVALS[box]*DAY;else dueAt=Date.now()+10*60*1000;state.wordStats[q.word]={box,seen:(s.seen||0)+1,correct:(s.correct||0)+(good?1:0),dueAt,lastReviewed:new Date().toISOString()}}
function answerQuestion(choice){if(!practice||practice.answeredCurrent)return;const q=practice.list[practice.index];practice.answeredCurrent=true;lastChoice=choice;const good=choice===q.correct;state.answered++;state.todayAnswered++;state.xp+=good?10:3;if(good){state.correct++;practice.sessionCorrect++}updateStreak();const t=topicStat(q.topic);state.topicStats[q.topic]={answered:t.answered+1,correct:t.correct+(good?1:0)};updateWordReview(q,good);if(!good){const existing=state.errors.find(e=>e.id===q.id);if(existing){existing.count++;existing.lastAt=new Date().toISOString()}else state.errors.push({id:q.id,word:q.word||null,category:q.category,topic:q.topic,prompt:q.prompt.replace(/<[^>]*>/g,''),correctText:q.answers[q.correct],explanation:q.explanation.replace(/<[^>]*>/g,''),count:1,lastAt:new Date().toISOString()})}saveLocal();renderQuestion()}
function renderQuestion(){const q=practice.list[practice.index],done=practice.answeredCurrent,progress=Math.round((practice.index+1)/practice.list.length*100);const answers=q.answers.map((a,i)=>{let cls='answer';if(done&&i===q.correct)cls+=' correct';if(done&&i===lastChoice&&i!==q.correct)cls+=' wrong';return`<button class="${cls}" ${done?'disabled':''} onclick="answerQuestion(${i})">${a}</button>`}).join('');let feedback='';if(done){const good=lastChoice===q.correct;feedback=`<div class="feedback ${good?'good':'bad'}"><strong>${good?'✓ נכון':'✗ לא נכון'}</strong><div class="explanation">${q.explanation}</div></div><div style="margin-top:12px"><button class="primary-btn" onclick="nextQuestion()">${practice.index===practice.list.length-1?'סיום האימון':'לשאלה הבאה'}</button></div>`}const timer=practice.timed?`<span id="psycho-timer" class="pill">⏱ ${formatPsychoTime(practice.timeLeft)}</span>`:'';document.getElementById('app').innerHTML=`<div class="app-shell"><div class="practice-head"><button class="back" onclick="go('home')">← יציאה</button><span class="badge">${q.category} · ${q.topic}</span>${timer}</div><div class="progress" style="background:#e6e9f0;margin:0 auto 16px;max-width:760px"><div style="width:${progress}%;background:#5965e0"></div></div><div class="practice-card"><div class="small">שאלה ${practice.index+1} מתוך ${practice.list.length}</div><div class="question">${q.prompt}</div><div class="answers">${answers}</div>${feedback}</div></div>`}
function nextQuestion(){if(practice.index<practice.list.length-1){practice.index++;practice.answeredCurrent=false;lastChoice=null;renderQuestion()}else finishPractice()}
function finishPractice(){clearInterval(psychoTimer);if(practice?.timed){state.simulationHistory=state.simulationHistory||[];state.simulationHistory.push({date:new Date().toISOString(),score:percent(practice.sessionCorrect,practice.list.length),correct:practice.sessionCorrect,total:practice.list.length});state.simulationHistory=state.simulationHistory.slice(-20);saveLocal()}view='summary';render()}
function summary(){const sim=practice?.timed;return`<div class="app-shell">${topbar()}<div class="practice-card" style="text-align:center"><div class="emoji">🏁</div><h2>${sim?'הסימולציה הושלמה':'האימון הושלם'}</h2><p class="small">${sim?'התוצאה נשמרה במסך ההתקדמות.':'המילים והנושאים עודכנו אוטומטית לפי הביצועים.'}</p><div class="stats" style="margin:20px 0"><div class="stat"><strong>${practice?.sessionCorrect||0}</strong><span>נכונות</span></div><div class="stat"><strong>${practice?.list.length||0}</strong><span>שאלות</span></div><div class="stat"><strong>${percent(practice?.sessionCorrect||0,practice?.list.length||0)}%</strong><span>דיוק</span></div></div><button class="primary-btn" onclick="go('home')">חזרה לבית</button></div>${nav('')}</div>`}
function findErrorQuestion(e){let q=[...questions.quantitative,...questions.verbal].find(x=>x.id===e.id);if(q)return q;if(e.word){const w=wordBank.find(x=>x.word===e.word);if(w)return makeWordQuestion(w,0)}return null}
function startErrorPractice(){const list=shuffle((state.errors||[]).map(findErrorQuestion).filter(Boolean)).slice(0,20);if(!list.length){alert('אין כרגע טעויות שניתן לתרגל.');return}practice={list,index:0,answeredCurrent:false,sessionCorrect:0,timed:false,kind:'errors'};lastChoice=null;view='question';render()}
function errorsView(){const content=state.errors.length?state.errors.slice().sort((a,b)=>(b.count||1)-(a.count||1)).map(e=>`<div class="error-item"><strong>${escapeHtml(e.topic)} · ${escapeHtml(e.category)}</strong><div>${escapeHtml(e.prompt)}</div><div class="small" style="margin-top:5px">תשובה נכונה — ${escapeHtml(e.correctText)}</div><div class="small">${escapeHtml(e.explanation)}</div>${e.count>1?`<span class="pill">טעית ${e.count} פעמים</span>`:''}</div>`).join(''):`<div class="empty">עדיין אין טעויות במחברת 🎉</div>`;return`<div class="app-shell">${topbar()}<div class="section-title">מחברת טעויות</div><div class="card">${content}</div>${state.errors.length?'<button class="primary-btn" onclick="startErrorPractice()">תרגל את הטעויות שלי</button>':''}${nav('errors')}</div>`}
function progressView(){const topics=Object.entries(state.topicStats);const content=topics.length?topics.sort((a,b)=>percent(a[1].correct,a[1].answered)-percent(b[1].correct,b[1].answered)).map(([topic,s])=>`<div class="topic-row"><div><strong>${topic}</strong><div class="small">${s.correct} נכונות מתוך ${s.answered}</div></div><span class="pill">${percent(s.correct,s.answered)}%</span></div>`).join(''):`<div class="empty">פתור כמה שאלות כדי לראות ניתוח לפי נושא.</div>`;const sims=(state.simulationHistory||[]).slice(-5).reverse();const simHtml=sims.length?sims.map(s=>`<div class="topic-row"><span>${new Date(s.date).toLocaleDateString('he-IL')}</span><span class="pill">${s.score}%</span></div>`).join(''):'<div class="empty">עדיין לא בוצעה סימולציה.</div>';return`<div class="app-shell">${topbar()}<div class="section-title">התקדמות</div><div class="stats" style="margin-bottom:12px"><div class="stat"><strong>${state.answered}</strong><span>שאלות</span></div><div class="stat"><strong>${state.correct}</strong><span>נכונות</span></div><div class="stat"><strong>${percent(state.correct,state.answered)}%</strong><span>דיוק</span></div></div><div class="card">${content}</div><div class="section-title">סימולציות אחרונות</div><div class="card">${simHtml}</div>${nav('progress')}</div>`}
function accountView(){const configured=cloudConfigured(),logged=!!state.user;return`<div class="app-shell">${topbar()}<div class="section-title">חשבון וסנכרון</div><div class="card">${configured?(logged?`<div class="success-note">מחובר כ־${escapeHtml(state.user.email||'משתמש')}. ההתקדמות נשמרת בענן וניתנת למשיכה ממחשב ומטלפון.</div><div class="section-title">סיסמה לכניסה ממכשיר נוסף</div><p class="small">אפשר להגדיר כאן סיסמה פעם אחת. אחר כך בטלפון או במחשב אחר אפשר להתחבר מיד עם האימייל והסיסמה בלי לחכות למייל.</p><div class="form-group"><label>סיסמה חדשה</label><input id="new-password" type="password" autocomplete="new-password" placeholder="לפחות 6 תווים"></div><button class="secondary-btn" onclick="setCloudPassword()">הגדר / שנה סיסמה</button><div id="password-msg" class="small" style="margin-top:10px"></div><div class="actions"><button class="primary-btn" onclick="syncNow()">סנכרן עכשיו</button><button class="secondary-btn" onclick="cloudLogout()">התנתק</button></div>`:`<p><strong>כניסה מהירה עם סיסמה</strong></p><div class="form-group"><label>אימייל</label><input id="login-email" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="form-group"><label>סיסמה</label><input id="login-password" type="password" autocomplete="current-password" placeholder="הסיסמה שהגדרת"></div><button class="primary-btn" onclick="loginWithPassword()">התחבר</button><div id="password-login-msg" class="small" style="margin-top:10px"></div><div class="section-title">או התחברות בקישור למייל</div><p class="small">Magic Link מוגבל בכמות המיילים ש-Supabase שולח. אם קיבלת הודעת מגבלה, עדיף להשתמש בסיסמה.</p><div class="form-group"><label>אימייל</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div><button class="secondary-btn" onclick="requestMagicLink()">שלח קישור התחברות</button><div id="auth-msg" class="small" style="margin-top:10px"></div>`):`<div class="notice"><strong>מצב מקומי פעיל.</strong><br>האפליקציה כבר עובדת בטלפון ובמחשב, אך סנכרון אוטומטי ביניהם דורש חיבור חד־פעמי ל־Supabase.</div>`}<div class="section-title">גיבוי ידני</div><p class="small">אפשר להעביר את ההתקדמות בין מכשירים גם באופן ידני.</p><div class="actions"><button class="secondary-btn" onclick="exportProgress()">ייצא התקדמות</button><label class="file-label">ייבא התקדמות<input hidden type="file" accept="application/json" onchange="importProgress(event)"></label></div></div><div class="section-title">התקנה בטלפון</div><div class="card"><p class="small">באנדרואיד אפשר לבחור התקנת אפליקציה בדפדפן. ב־iPhone אפשר לבחור שיתוף ואז הוספה למסך הבית.</p>${deferredInstallPrompt?'<button class="primary-btn" onclick="installApp()">התקן את IDpsycho101</button>':''}</div>${nav('')}</div>`}
function go(next){clearInterval(psychoTimer);view=next;practice=null;lastChoice=null;render()}
function resetData(){if(confirm('לאפס את כל נתוני התרגול במכשיר זה?')){state=defaultState();saveLocal();render()}}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='psycho101-progress.json';a.click();URL.revokeObjectURL(url)}
function importProgress(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const imported=JSON.parse(r.result);state={...defaultState(),...imported};saveLocal();alert('ההתקדמות יובאה בהצלחה');render()}catch{alert('הקובץ אינו קובץ התקדמות תקין')}};r.readAsText(f)}

// Supabase cloud sync. The SDK is loaded only when cloud sync is configured and needed.
let supabaseClient=null,supabaseLoadPromise=null;
function cloudConfigured(){return Boolean(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY)}
function loadSupabaseSdk(){if(window.supabase)return Promise.resolve(window.supabase);if(supabaseLoadPromise)return supabaseLoadPromise;supabaseLoadPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';script.async=true;script.onload=()=>resolve(window.supabase);script.onerror=()=>reject(new Error('Supabase SDK failed to load'));document.head.appendChild(script)});return supabaseLoadPromise}
async function getSupabase(){if(!cloudConfigured())return null;if(supabaseClient)return supabaseClient;const sdk=await loadSupabaseSdk();supabaseClient=sdk.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});supabaseClient.auth.onAuthStateChange(async(event,session)=>{const user=session?.user||null;state.user=user?{id:user.id,email:user.email}:null;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));if(user&&(event==='SIGNED_IN'||event==='INITIAL_SESSION')){await syncNow(true)}render()});return supabaseClient}
async function requestMagicLink(){const email=document.getElementById('email')?.value?.trim(),msg=document.getElementById('auth-msg');if(!email){msg.textContent='הזן אימייל תקין';return}msg.textContent='שולח…';try{const sb=await getSupabase();const redirect=location.origin+location.pathname;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect}});if(error)throw error;msg.textContent='נשלח קישור התחברות. פתח אותו, ואז חזור ל-IDpsycho101.'}catch(e){const code=e?.code||e?.status||'';const details=e?.message||'שגיאה לא ידועה';if(String(code)==='429'||/rate|seconds|minute|limit/i.test(details)){msg.textContent='מכסת מיילי ההתחברות הזמנית של Supabase נוצלה. אל תלחץ שוב ושוב. נסה מאוחר יותר, או התחבר עם סיסמה.'}else{msg.textContent='שליחת הקישור נכשלה: '+details+(code?' ('+code+')':'');}console.error('Supabase login error',e)}}
async function loginWithPassword(){const email=document.getElementById('login-email')?.value?.trim(),password=document.getElementById('login-password')?.value||'',msg=document.getElementById('password-login-msg');if(!email||!password){msg.textContent='הזן אימייל וסיסמה';return}msg.textContent='מתחבר…';try{const sb=await getSupabase();const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;const user=data?.user;state.user=user?{id:user.id,email:user.email}:state.user;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));await syncNow(true);msg.textContent='התחברת בהצלחה';render()}catch(e){msg.textContent='הכניסה נכשלה. בדוק את האימייל והסיסמה.';console.error('Password login error',e)}}
async function setCloudPassword(){const password=document.getElementById('new-password')?.value||'',msg=document.getElementById('password-msg');if(password.length<6){msg.textContent='הסיסמה צריכה להכיל לפחות 6 תווים';return}msg.textContent='שומר…';try{const sb=await getSupabase();const{error}=await sb.auth.updateUser({password});if(error)throw error;msg.textContent='הסיסמה נשמרה. מעכשיו אפשר להתחבר איתה ממכשיר אחר.'}catch(e){msg.textContent='לא הצלחנו לשמור את הסיסמה: '+(e?.message||'שגיאה לא ידועה');console.error('Set password error',e)}}
async function hydrateCloudUser(){if(!cloudConfigured())return;try{const sb=await getSupabase();const{data,error}=await sb.auth.getUser();if(error)throw error;const user=data?.user;state.user=user?{id:user.id,email:user.email}:null;localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch{state.user=null;localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}}
async function cloudLogout(){try{const sb=await getSupabase();await sb.auth.signOut()}catch{}state.user=null;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));render()}
let cloudTimer=null;function debouncedCloudSave(){clearTimeout(cloudTimer);if(cloudConfigured()&&state.user)cloudTimer=setTimeout(()=>cloudPush().catch(()=>{}),1200)}
function syncPayload(){const copy=JSON.parse(JSON.stringify(state));delete copy.user;delete copy.lastSync;return copy}
async function cloudPush(){if(!state.user)return;const sb=await getSupabase();const{error}=await sb.from('psycho101_progress').upsert({user_id:state.user.id,state:syncPayload(),updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;state.lastSync=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
async function cloudPull(){if(!state.user)return null;const sb=await getSupabase();const{data,error}=await sb.from('psycho101_progress').select('state,updated_at').eq('user_id',state.user.id).maybeSingle();if(error)throw error;return data||null}
function mergeStates(local,remote){if(!remote)return local;const out={...defaultState(),...remote,...local};out.answered=Math.max(local.answered||0,remote.answered||0);out.correct=Math.max(local.correct||0,remote.correct||0);out.xp=Math.max(local.xp||0,remote.xp||0);out.streak=Math.max(local.streak||1,remote.streak||1);out.todayAnswered=Math.max(local.todayAnswered||0,remote.todayAnswered||0);out.wordStats={...(remote.wordStats||{}),...(local.wordStats||{})};for(const word of new Set([...Object.keys(remote.wordStats||{}),...Object.keys(local.wordStats||{})])){const a=local.wordStats?.[word],b=remote.wordStats?.[word];if(!a)out.wordStats[word]=b;else if(!b)out.wordStats[word]=a;else out.wordStats[word]=(new Date(a.lastReviewed||0)>=new Date(b.lastReviewed||0))?a:b}out.topicStats={...(remote.topicStats||{}),...(local.topicStats||{})};out.errors=[...(remote.errors||[])];for(const e of(local.errors||[])){const ix=out.errors.findIndex(x=>x.id===e.id);if(ix<0)out.errors.push(e);else if((e.count||1)>(out.errors[ix].count||1))out.errors[ix]=e}const sims=[...(remote.simulationHistory||[]),...(local.simulationHistory||[])];const seen=new Set();out.simulationHistory=sims.filter(s=>{const k=(s.date||'')+'|'+(s.score||0);if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-20);out.lastStudyDate=[local.lastStudyDate,remote.lastStudyDate].filter(Boolean).sort().pop()||null;out.user=local.user;return out}
async function syncNow(silent=false){try{const row=await cloudPull();if(row?.state)state=mergeStates(state,row.state);await cloudPush();if(!silent)alert('הסנכרון הושלם');render()}catch(e){if(!silent)alert('הסנכרון נכשל. בדוק חיבור והגדרות ענן.')}}

const THEME_KEY='idpsycho101-theme';
function isDarkMode(){return document.body.classList.contains('dark-mode')}
function applySavedTheme(){
  const saved=localStorage.getItem(THEME_KEY);
  const useDark=saved==='dark'||(!saved&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.classList.toggle('dark-mode',useDark);
}
function toggleTheme(){
  const next=!isDarkMode();
  document.body.classList.toggle('dark-mode',next);
  localStorage.setItem(THEME_KEY,next?'dark':'light');
  render();
}
applySavedTheme();

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;render()});async function installApp(){if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;render()}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
function render(){const app=document.getElementById('app');if(view==='home')app.innerHTML=home();else if(view==='practice-menu')app.innerHTML=practiceMenu();else if(view==='words-dashboard')app.innerHTML=wordsDashboard();else if(view==='question')renderQuestion();else if(view==='errors')app.innerHTML=errorsView();else if(view==='progress')app.innerHTML=progressView();else if(view==='account')app.innerHTML=accountView();else if(view==='summary')app.innerHTML=summary()}
(async()=>{if(cloudConfigured()){await hydrateCloudUser();if(state.user)await syncNow(true)}render()})();

</script>
