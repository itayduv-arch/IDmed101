name: App health checks

on:
  push:
    paths:
      - 'idmed101/**'
      - 'psycho101/**'
      - '.github/workflows/health-fix-both-apps-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required app files
        shell: bash
        run: |
          test -f idmed101/index.html
          test -f idmed101/sw.js
          test -f psycho101/index.html
          test -f psycho101/sw.js

      - name: Check standalone JavaScript syntax
        shell: bash
        run: |
          set -e
          find idmed101 psycho101 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          for page in [Path('idmed101/index.html'), Path('psycho101/index.html')]:
              html = page.read_text(encoding='utf-8')
              scripts = re.findall(r'<script([^>]*)>([\s\S]*?)</script>', html, re.I)
              checked = 0
              for attrs, src in scripts:
                  if 'src=' in attrs.lower() or not src.strip():
                      continue
                  checked += 1
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                      f.write(src)
                      tmp = f.name
                  subprocess.run(['node', '--check', tmp], check=True)
              print(f'{page}: checked {checked} inline script block(s)')
          PY

      - name: Validate JSON files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          for root in [Path('idmed101'), Path('psycho101')]:
              for path in root.rglob('*.json'):
                  print('Checking', path)
                  json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Guard against stale service-worker registrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for app in ['idmed101', 'psycho101']:
              html = Path(app, 'index.html').read_text(encoding='utf-8')
              sw = Path(app, 'sw.js').read_text(encoding='utf-8')
              assert 'serviceWorker' in html, f'{app}: service worker registration missing'
              assert 'CACHE_NAME' in sw, f'{app}: CACHE_NAME missing'
              print(f'{app}: service worker wiring present')
          PY
