name: Fix Psycho101 daily state

on:
  push:
    paths:
      - '.github/workflows/fix-psycho-daily.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize Psycho101 daily state migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('psycho101/index.html')
          text=path.read_text(encoding='utf-8')
          original=text

          replacements=[
            ('dailyResetFixVersion:3','dailyResetFixVersion:4'),
            ('(state.dailyResetFixVersion||0)<3','(state.dailyResetFixVersion||0)<4'),
            ('state.dailyResetFixVersion=3','state.dailyResetFixVersion=4'),
            ('(local.dailyResetFixVersion||0)>=3','(local.dailyResetFixVersion||0)>=4'),
            ('(remote.dailyResetFixVersion||0)>=3','(remote.dailyResetFixVersion||0)>=4'),
            ('out.dailyResetFixVersion=3','out.dailyResetFixVersion=4'),
          ]
          for old,new in replacements:
            count=text.count(old)
            assert count>=1, f'missing expected token: {old}'
            text=text.replace(old,new)

          old="(async()=>{ensureDailyState();if(cloudConfigured()){await hydrateCloudUser();if(state.user)await syncNow(true)}ensureDailyState();render()})();"
          new="(async()=>{ensureDailyState();if(cloudConfigured()){await hydrateCloudUser();if(state.user)await syncNow(true)}const dailyChanged=ensureDailyState();if(dailyChanged&&state.user){try{await cloudPush()}catch{}}render()})();"
          assert text.count(old)==1, f'startup match count={text.count(old)}'
          text=text.replace(old,new)

          old="if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));"
          new="if('serviceWorker'in navigator&&location.protocol.startsWith('http')){let reloadingForSW=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloadingForSW)return;reloadingForSW=true;location.reload()});window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=20260916-22',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));}"
          assert text.count(old)==1, f'service worker registration match count={text.count(old)}'
          text=text.replace(old,new)

          assert text!=original
          path.write_text(text,encoding='utf-8')
          Path('psycho101/version.json').write_text('{"version":"20260916-22"}\n',encoding='utf-8')
          PY

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('psycho101/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script([^>]*)>([\s\S]*?)</script>',html,re.I)
          checked=0
          for attrs,src in scripts:
            if 'src=' in attrs.lower() or not src.strip():
              continue
            checked+=1
            p=Path(f'/tmp/psycho-inline-{checked}.js')
            p.write_text(src,encoding='utf-8')
            subprocess.run(['node','--check',str(p)],check=True)
          print(f'Checked {checked} inline scripts')
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add psycho101/index.html psycho101/version.json
          git commit -m 'Finalize Psycho101 daily goal migration'
          git push
