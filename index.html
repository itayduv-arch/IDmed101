<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>101 Apps</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,"Segoe UI",sans-serif;background:#f5f7fb;color:#182033;padding:24px;transition:.25s}
    body.dark{background:#111827;color:#f3f4f6}
    .wrap{width:min(760px,100%)}
    h1{text-align:center;font-size:36px;margin:0 0 10px}
    .sub{text-align:center;color:#6d7485;margin-bottom:10px}
    .nudge{text-align:center;color:#5965e0;font-weight:800;margin-bottom:28px;font-size:14px}
    body.dark .sub{color:#aeb6c6} body.dark .nudge{color:#aab2ff}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
    a{text-decoration:none;color:inherit;border-radius:24px}
    a:focus-visible{outline:4px solid rgba(89,101,224,.35);outline-offset:4px}
    .card{background:white;border:1px solid #e6e9f0;border-radius:24px;padding:28px;box-shadow:0 12px 35px rgba(24,32,51,.08);transition:.2s;min-height:220px;display:flex;flex-direction:column;justify-content:space-between}
    body.dark .card{background:#1f2937;border-color:#374151;box-shadow:0 12px 35px rgba(0,0,0,.3)}
    .card:hover{transform:translateY(-3px)}
    .icon{font-size:42px} h2{margin:18px 0 8px;font-size:25px} p{margin:0;color:#6d7485;line-height:1.5} body.dark p{color:#c0c7d4}
    .open{margin-top:24px;font-weight:800;color:#5965e0} body.dark .open{color:#9aa4ff}
    .micro{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:#eef0ff;color:#4d58c7;font-size:12px;font-weight:800} body.dark .micro{background:#30365f;color:#d7dbff}
    .theme-toggle{position:fixed;top:18px;left:18px;border:1px solid #d7dce6;background:white;color:#182033;border-radius:999px;padding:9px 13px;font-size:18px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.08)}
    body.dark .theme-toggle{background:#1f2937;color:#f3f4f6;border-color:#4b5563}
    @media(max-width:620px){.grid{grid-template-columns:1fr} h1{font-size:30px}.card{min-height:190px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="החלפת מצב תצוגה" onclick="toggleLauncherTheme()">🌙</button>
  <main class="wrap">
    <h1>101 Apps</h1>
    <div class="sub">בחר את האפליקציה שתרצה לפתוח</div>
    <div class="nudge">גם 5 דקות נחשבות — העיקר להתחיל.</div>
    <div class="grid">
      <a href="./idmed101/?v=20260916-1" aria-label="פתיחת מבחן ידע 101">
        <section class="card"><div><div class="icon">🧬</div><h2>מבחן ידע 101</h2><p>כרטיסיות, שאלות, סימולציות ונקודות חיזוק למבחן הידע.</p><span class="micro">שיעורים קצרים · שחזורים מאומתים</span></div><div class="open">התחל תרגול ←</div></section>
      </a>
      <a href="./psycho101/?v=20260916-1" aria-label="פתיחת פסיכו 101">
        <section class="card"><div><div class="icon">🧠</div><h2>IDpsycho101</h2><p>תרגול מילים, חשיבה כמותית וחשיבה מילולית לפסיכומטרי.</p><span class="micro">אפשר להתחיל באימון קצר</span></div><div class="open">התחל תרגול ←</div></section>
      </a>
    </div>
  </main>
  <script>
    const launcherThemeKey='id101-launcher-theme';
    function applyLauncherTheme(theme){const dark=theme==='dark';document.body.classList.toggle('dark',dark);document.getElementById('theme-toggle').textContent=dark?'☀️':'🌙'}
    function toggleLauncherTheme(){const next=document.body.classList.contains('dark')?'light':'dark';localStorage.setItem(launcherThemeKey,next);applyLauncherTheme(next)}
    const savedLauncherTheme=localStorage.getItem(launcherThemeKey);applyLauncherTheme(savedLauncherTheme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  </script>
</body>
</html>
